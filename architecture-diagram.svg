<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490">
  <style>
    .bg    { fill: #ffffff; }
    .box   { fill: #ffffff; stroke: #1f2328; stroke-width: 1.25; }
    .ghost { fill: #ffffff; stroke: #1f2328; stroke-width: 1.25; opacity: .45; }
    .db    { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.25; }
    .t     { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .k     { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s     { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .m     { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .vid   { stroke: #0969da; stroke-width: 1.5; fill: none; }
    .evt   { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .vh    { fill: #0969da; }
    .eh    { fill: #59636e; }
    .vt    { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .box, .ghost { fill: #0d1117; stroke: #d1d9e0; }
      .db    { fill: #151b23; stroke: #d1d9e0; }
      .t, .k { fill: #f0f6fc; }
      .s, .m { fill: #9198a1; }
      .vid   { stroke: #4493f8; }
      .evt   { stroke: #9198a1; }
      .vh, .vt { fill: #4493f8; }
      .eh    { fill: #9198a1; }
    }
  </style>

  <defs>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="vh" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="eh" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="490"/>

  <!-- video path -->
  <rect class="box" x="20" y="72" width="140" height="56" rx="6"/>
  <text class="t" x="90" y="96" text-anchor="middle">Cameras</text>
  <text class="m" x="90" y="114" text-anchor="middle">cam-01, cam-02</text>

  <rect class="box" x="230" y="72" width="150" height="56" rx="6"/>
  <text class="t" x="305" y="96" text-anchor="middle">MediaMTX</text>
  <text class="s" x="305" y="114" text-anchor="middle">RTSP / WebRTC</text>

  <rect class="ghost" x="466" y="42" width="230" height="118" rx="6"/>
  <rect class="box" x="460" y="48" width="230" height="118" rx="6"/>
  <text class="t" x="478" y="72">yolo-worker</text>
  <text class="s" x="672" y="72" text-anchor="end">one per camera</text>
  <text x="478" y="96"><tspan class="k">YOLOv8n</tspan><tspan class="s" x="545">person detection</tspan></text>
  <text x="478" y="114"><tspan class="k">BoTSORT</tspan><tspan class="s" x="545">tracking</tspan></text>
  <text x="478" y="132"><tspan class="k">OSNet</tspan><tspan class="s" x="545">512-d ReID embedding</tspan></text>
  <text x="478" y="150"><tspan class="k">FFmpeg</tspan><tspan class="s" x="545">annotated H.264 out</tspan></text>

  <rect class="box" x="800" y="72" width="170" height="56" rx="6"/>
  <text class="t" x="885" y="96" text-anchor="middle">Dashboard</text>
  <text class="s" x="885" y="114" text-anchor="middle">React, served by nginx</text>

  <line class="vid" x1="160" y1="100" x2="229" y2="100" marker-end="url(#v)"/>
  <text class="s vt" x="195" y="92" text-anchor="middle">RTSP</text>

  <line class="vid" x1="380" y1="89" x2="459" y2="89" marker-end="url(#v)"/>
  <text class="s vt" x="420" y="81" text-anchor="middle">raw</text>
  <line class="vid" x1="460" y1="113" x2="381" y2="113" marker-end="url(#v)"/>
  <text class="s vt" x="420" y="130" text-anchor="middle">annotated</text>

  <path class="vid" d="M305,72 V24 H885 V71" marker-end="url(#v)"/>
  <text class="s vt" x="595" y="17" text-anchor="middle">WebRTC (WHEP), annotated stream</text>

  <!-- event path -->
  <rect class="box" x="460" y="246" width="230" height="112" rx="6"/>
  <text class="t" x="478" y="270">Kafka</text>
  <text class="s" x="672" y="270" text-anchor="end">KRaft, single broker</text>
  <text class="m" x="478" y="293">doorbell-detections</text>
  <text class="m" x="478" y="310">doorbell-analysis-requests</text>
  <text class="m" x="478" y="327">doorbell-analysis-results</text>
  <text class="m" x="478" y="344">doorbell-dlq</text>

  <line class="evt" x1="575" y1="166" x2="575" y2="245" marker-end="url(#e)"/>
  <text class="s" x="585" y="203">detections, positions,</text>
  <text class="s" x="585" y="218">person crops</text>

  <rect class="box" x="230" y="270" width="150" height="64" rx="6"/>
  <text class="t" x="305" y="295" text-anchor="middle">vlm-worker</text>
  <text class="s" x="305" y="314" text-anchor="middle">safe / watch / alert</text>

  <rect class="box" x="20" y="270" width="140" height="64" rx="6"/>
  <text class="t" x="90" y="295" text-anchor="middle">Ollama</text>
  <text class="m" x="90" y="314" text-anchor="middle">qwen2.5vl:3b</text>

  <line class="evt" x1="460" y1="290" x2="381" y2="290" marker-end="url(#e)"/>
  <text class="s" x="420" y="282" text-anchor="middle">crops</text>
  <line class="evt" x1="380" y1="316" x2="459" y2="316" marker-end="url(#e)"/>
  <text class="s" x="420" y="333" text-anchor="middle">verdicts</text>

  <line class="evt" x1="229" y1="302" x2="161" y2="302" marker-start="url(#e)" marker-end="url(#e)"/>
  <text class="s" x="195" y="294" text-anchor="middle">HTTP</text>

  <rect class="box" x="800" y="258" width="170" height="80" rx="6"/>
  <text class="t" x="885" y="284" text-anchor="middle">java-backend</text>
  <text class="s" x="885" y="303" text-anchor="middle">Spring Boot 4</text>
  <text class="s" x="885" y="320" text-anchor="middle">re-ID matching</text>

  <line class="evt" x1="690" y1="298" x2="799" y2="298" marker-end="url(#e)"/>
  <text class="s" x="745" y="290" text-anchor="middle">consume</text>

  <line class="evt" x1="885" y1="257" x2="885" y2="129" marker-start="url(#e)" marker-end="url(#e)"/>
  <text class="s" x="875" y="188" text-anchor="end">STOMP over WebSocket</text>
  <text class="s" x="875" y="204" text-anchor="end">REST /api/persons</text>

  <!-- storage -->
  <path class="db" d="M760,417 V465 A60,7 0 0 0 880,465 V417 A60,7 0 0 0 760,417 z"/>
  <ellipse class="db" cx="820" cy="417" rx="60" ry="7"/>
  <text class="t" x="820" y="445" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="820" y="462" text-anchor="middle">persons, detections</text>

  <path class="db" d="M900,417 V465 A45,7 0 0 0 990,465 V417 A45,7 0 0 0 900,417 z"/>
  <ellipse class="db" cx="945" cy="417" rx="45" ry="7"/>
  <text class="t" x="945" y="445" text-anchor="middle">Qdrant</text>
  <text class="s" x="945" y="462" text-anchor="middle">embeddings</text>

  <line class="evt" x1="820" y1="338" x2="820" y2="409" marker-end="url(#e)"/>
  <line class="evt" x1="945" y1="338" x2="945" y2="409" marker-end="url(#e)"/>
  <text class="s" x="937" y="379" text-anchor="end">cosine ≥ 0.75</text>

  <!-- key -->
  <line class="vid" x1="20" y1="462" x2="50" y2="462"/>
  <text class="s" x="58" y="466">video</text>
  <line class="evt" x1="110" y1="462" x2="140" y2="462"/>
  <text class="s" x="148" y="466">messages / requests</text>
</svg>
